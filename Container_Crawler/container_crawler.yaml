#
# Run Container_Crawler as root on every host in an inventory and collect the
# CSV logs on the control node.
#
# Usage (expects container_crawler.py in the same directory as this file):
#   ansible-playbook -i <inventory> container_crawler.yaml
#
# To use the script from another location:
#   ansible-playbook -i <inventory> container_crawler.yaml \
#     -e cc_script=/path/to/container_crawler.py
#
# Results: one file per host in Logs/ next to this file, named
# Container_Crawler-<short hostname>.log (the host's own `hostname -s`, which is
# also the hostname column in the CSV; it can differ from the inventory name).
# Two hosts with the same short hostname would overwrite each other's file.
#
# Aggregate into one CSV. Every file starts with the same header row, so a plain
# `cat` repeats it; this keeps only the first. The glob skips Aggregate.log, so
# it is safe to re-run in the same directory:
#   cd Logs
#   awk 'FNR == 1 && NR != 1 { next } 1' Container_Crawler-*.log > Aggregate.log
#
# Exit code 2 from the tool means some container could not be checked; the
# status/error columns in the log say which. Exit code 1 usually means the host
# has no docker or podman, and that host shows as failed in the play recap.
- name: Run Container_Crawler and collect logs
  hosts: all
  become: true
  # The minimal subset is enough for ansible_facts['hostname'], the host's own
  # short hostname, and keeps fact gathering fast.
  gather_facts: true
  gather_subset:
    - min
  vars:
    cc_script: "{{ playbook_dir }}/container_crawler.py"
    cc_log: /tmp/Container_Crawler.log
    cc_logs: "{{ playbook_dir }}/Logs"
  tasks:
    - name: Run Container_Crawler
      ansible.builtin.script:
        cmd: "{{ cc_script }} --log {{ cc_log }}"
      register: cc
      changed_when: false
      failed_when: cc.rc not in [0, 2]

    - name: Fetch the log to the control node
      ansible.builtin.fetch:
        src: "{{ cc_log }}"
        dest: "{{ cc_logs }}/Container_Crawler-{{ ansible_facts['hostname'] }}.log"
        flat: true

    # The log lists container names and images and /tmp is world-readable.
    - name: Remove the log from the host
      ansible.builtin.file:
        path: "{{ cc_log }}"
        state: absent
